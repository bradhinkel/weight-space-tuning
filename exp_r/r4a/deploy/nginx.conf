# /etc/nginx/sites-available/tool-router.bradhinkel.com (TLS lines added by `certbot --nginx -d tool-router.bradhinkel.com`).
# Every POST /api/run spends RunPod GPU time, so it is rate limited per client IP.
limit_req_zone $binary_remote_addr zone=toolrouter:1m rate=60r/m;

server {
    listen 80;
    server_name tool-router.bradhinkel.com;
    client_max_body_size 16k;

    location = /api/run {
        limit_req zone=toolrouter burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_read_timeout 330s;   # a cold start can take ~2 min; the server gives up after 300 s
    }
    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
    }
}
